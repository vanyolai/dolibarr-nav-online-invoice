name: Apply point-of-tax integration cleanup

on:
  push:
    branches:
      - feature/nav-sync-foundation
    paths:
      - .github/workflows/apply-pointoftax-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nav-sync-foundation
          fetch-depth: 0

      - name: Apply cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'class/actions_navinvoice.class.php',
              """        if (!is_object($object) || (string) ($object->element ?? '') !== 'invoice_supplier' || empty($object->id)) {
            return 0;
        }

        $sql = 'SELECT date_pointoftax FROM '.MAIN_DB_PREFIX.'facture_fourn';
""",
              """        if (!is_object($object) || (string) ($object->element ?? '') !== 'invoice_supplier' || empty($object->id)) {
            return 0;
        }

        // Newer/patched Dolibarr cores load and render supplier date_pointoftax
        // natively. Keep this hook only as a compatibility fallback for cores
        // where FactureFournisseur::fetch() still omits the field.
        if (!empty($object->date_pointoftax)) {
            return 0;
        }

        $sql = 'SELECT date_pointoftax FROM '.MAIN_DB_PREFIX.'facture_fourn';
""",
              'supplier card fallback guard'
          )

          replace_once(
              'core/modules/modNavInvoice.class.php',
              "$this->version = '0.7.2';",
              "$this->version = '0.7.3';",
              'module version'
          )

          replace_once(
              'class/navapi.class.php',
              "$this->softwareVersion = '0.7.1';",
              "$this->softwareVersion = '0.7.3';",
              'NAV software version'
          )

          p = Path('CHANGELOG.md')
          s = p.read_text()
          marker = '# Changelog\n\n'
          entry = """## 0.7.3 - development

- Map NAV `invoiceDeliveryDate` to Dolibarr's native `date_pointoftax` field for imported customer and supplier invoices.
- Preserve a missing NAV payment due date as missing instead of inventing an invoice-date fallback.
- Keep the supplier point-of-tax card hook only as a compatibility fallback and avoid duplicate rendering when Dolibarr core supports the field natively.

"""
          if entry not in s:
              if marker not in s:
                  raise SystemExit('changelog marker missing')
              s = s.replace(marker, marker + entry, 1)
              p.write_text(s)
          PY

      - name: Syntax check changed PHP files
        run: |
          php -l class/actions_navinvoice.class.php
          php -l class/navinvoiceimporter.class.php
          php -l class/navapi.class.php
          php -l core/modules/modNavInvoice.class.php

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pointoftax-cleanup.yml
          git add class/actions_navinvoice.class.php class/navapi.class.php core/modules/modNavInvoice.class.php CHANGELOG.md
          git diff --cached --check
          git commit -m "fix: preserve NAV delivery and missing due dates"
          git push origin HEAD:feature/nav-sync-foundation
