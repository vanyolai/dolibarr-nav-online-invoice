name: Final audit refactor

on:
  push:
    branches:
      - refactor/final-audit
    paths:
      - .github/workflows/final-audit-refactor.yml
      - tools/final_audit_migrate.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/final-audit
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply final audit migration cleanup
        run: python3 tools/final_audit_migrate.py
      - name: Verify focused regression
        run: |
          php -l class/navinvoicesync.class.php
          php -l core/modules/modNavInvoice.class.php
          php -l class/navpurchaseworkbench.class.php
          php tests/parser_regression.php
          php tests/purchase_policy_regression.php
      - name: Commit final schema cleanup
        run: |
          git config user.name Vanyo
          git config user.email vanyolai@gmail.com
          git add -A
          git commit -m 'Finalize schema migration lifecycle'
          git push origin HEAD:refactor/final-audit
