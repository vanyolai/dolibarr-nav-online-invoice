name: Final audit refactor

on:
  push:
    branches:
      - refactor/final-audit
    paths:
      - .github/workflows/final-audit-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/final-audit
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply final audit cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('class/navpurchaseworkbench.class.php')
          text = p.read_text()
          needle = '        $this->ensureSchema();\n\n'
          if text.count(needle) != 2:
              raise SystemExit(f'workbench: expected 2 ensureSchema calls, found {text.count(needle)}')
          text = text.replace(needle, '')
          old = '        if (!$this->supplierPriceTierApplies($details, $line)) {'
          new = "        if (!NavPurchasePricePolicy::tierApplies($details, (float) ($line['quantity'] ?? 0))) {"
          if text.count(old) != 1:
              raise SystemExit('workbench: supplierPriceTierApplies call not found exactly once')
          text = text.replace(old, new)
          pattern = r'    /\*\* @param array<string,mixed> \$price @param array<string,mixed> \$line \*/\n    private function supplierPriceTierApplies\(array \$price, array \$line\): bool\n    \{.*?\n    \}\n\n'
          text, n = re.subn(pattern, '', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('workbench: duplicate tier helper block not found')
          start = text.find('    private function ensureSchema(): void\n')
          end = text.find('    private function objectError($object): string\n', start)
          if start < 0 or end < 0 or 'private function indexExists' not in text[start:end]:
              raise SystemExit('workbench: runtime schema block boundaries not found')
          text = text[:start] + text[end:]
          p.write_text(text)

          p = Path('class/navpurchasepricepolicy.class.php')
          text = p.read_text()
          loop_old = "            $minimum = max(0.0, (float) ($price['quantity'] ?? 0));\n            if ($minimum <= $quantity + 0.000001) {\n                $applicable[] = $price;\n            }\n"
          loop_new = "            if (self::tierApplies($price, $quantity)) {\n                $applicable[] = $price;\n            }\n"
          if text.count(loop_old) != 1:
              raise SystemExit('purchase policy: MOQ loop not found')
          text = text.replace(loop_old, loop_new)
          marker = '    public static function effectivePricesEqual(float $left, float $right): bool\n'
          method = "    /** @param array<string,mixed> $price */\n    public static function tierApplies(array $price, float $quantity): bool\n    {\n        $minimum = max(0.0, (float) ($price['quantity'] ?? 0));\n        return $minimum <= abs($quantity) + 0.000001;\n    }\n\n"
          if text.count(marker) != 1:
              raise SystemExit('purchase policy: insertion marker missing')
          text = text.replace(marker, method + marker)
          p.write_text(text)

          p = Path('class/navinvoiceimporter.class.php')
          text = p.read_text()
          include = "dol_include_once('/navinvoice/class/navunitresolver.class.php');\n"
          if text.count(include) != 1:
              raise SystemExit('importer: include marker missing')
          text = text.replace(include, include + "dol_include_once('/navinvoice/class/navpaymentresolver.class.php');\n")
          prop = '    /** @var NavUnitResolver */\n    private $unitResolver;\n'
          new_prop = prop + '\n    /** @var NavPaymentResolver */\n    private $paymentResolver;\n'
          if text.count(prop) != 1:
              raise SystemExit('importer: property marker missing')
          text = text.replace(prop, new_prop)
          ctor = '        $this->unitResolver = new NavUnitResolver($db);\n'
          if text.count(ctor) != 1:
              raise SystemExit('importer: constructor marker missing')
          text = text.replace(ctor, ctor + '        $this->paymentResolver = new NavPaymentResolver($db, $entity);\n')
          calls = "$this->paymentModeId((string) ($preview['header']['payment_method'] ?? ''))"
          if text.count(calls) != 2:
              raise SystemExit(f'importer: expected 2 paymentModeId calls, found {text.count(calls)}')
          text = text.replace(calls, "$this->paymentResolver->paymentModeId((string) ($preview['header']['payment_method'] ?? ''))")
          start = text.find('    private function paymentModeId(string $navMethod): int\n')
          end = text.find('    private function auditNote(array $preview, $record): string\n', start)
          if start < 0 or end < 0:
              raise SystemExit('importer: duplicate paymentModeId block boundaries not found')
          text = text[:start] + text[end:]
          p.write_text(text)

          p = Path('tests/purchase_policy_regression.php')
          text = p.read_text()
          marker = "expect_purchase_true(\n    NavPurchasePricePolicy::effectivePricesEqual(245.0 * 0.8, 196.0),\n"
          addition = "expect_purchase_true(\n    NavPurchasePricePolicy::tierApplies(array('quantity' => 50), 50),\n    'MOQ 50 must apply at quantity 50'\n);\nexpect_purchase_true(\n    !NavPurchasePricePolicy::tierApplies(array('quantity' => 50), 49),\n    'MOQ 50 must not apply below its threshold'\n);\n\n"
          if text.count(marker) != 1:
              raise SystemExit('purchase regression: insertion marker missing')
          text = text.replace(marker, addition + marker)
          p.write_text(text)
          PY

          php -l class/navpurchaseworkbench.class.php
          php -l class/navpurchasepricepolicy.class.php
          php -l class/navinvoiceimporter.class.php
          php tests/parser_regression.php
          php tests/purchase_policy_regression.php

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'Vanyo'
          git config user.email 'vanyolai@gmail.com'
          git add class/navpurchaseworkbench.class.php class/navpurchasepricepolicy.class.php class/navinvoiceimporter.class.php tests/purchase_policy_regression.php
          git commit -m 'Finish final audit cleanup'
          git push origin HEAD:refactor/final-audit
